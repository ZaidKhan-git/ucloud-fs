[package]
name = "ucloud-fs"
version = "0.1.0"
edition = "2024"
authors = ["ucloud-fs Team"]
description = "Unified Cloud VFS Router in Rust with Zero Persistent Disk Cache"

[dependencies]
thiserror = "2.0"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
proptest = "1.12"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
