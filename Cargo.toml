[package]
name = "ucloud-fs"
version = "0.1.0"
edition = "2024"
authors = ["ucloud-fs Team"]
description = "Unified Cloud VFS Router in Rust with Zero Persistent Disk Cache"

[dependencies]
thiserror = "2.0"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
zeroize = { version = "1.8", features = ["derive"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
governor = "0.10.4"
dashmap = "6.2.1"
bytes = "1.12.1"
rfd = { version = "0.17.2", default-features = false }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
proptest = "1.12"
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
